name: Native scene matrices

on:
  push:
    branches: [main]
    paths:
      - ports/common/guest_memory/**
      - ports/native-scene-matrices/**
      - ports/native-storage/check_android_elf.py
      - ports/runtime/billboard_warm64/**
      - ports/runtime/matrix64/**
      - ports/runtime/node_pose64/**
      - ports/runtime/static_matrix_plan64/**
      - ports/runtime/static_scene_events64/**
      - ports/runtime/stream_position64/**
      - .github/workflows/native-scene-matrices.yml
  pull_request:
    paths:
      - ports/common/guest_memory/**
      - ports/native-scene-matrices/**
      - ports/native-storage/check_android_elf.py
      - ports/runtime/billboard_warm64/**
      - ports/runtime/matrix64/**
      - ports/runtime/node_pose64/**
      - ports/runtime/static_matrix_plan64/**
      - ports/runtime/static_scene_events64/**
      - ports/runtime/stream_position64/**
      - .github/workflows/native-scene-matrices.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-scene-matrices:
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.13.5"
      - name: Build and test Windows Release and Debug
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force work/toolchains | Out-Null
          $nativeArchive = Join-Path (Get-Location) 'work/toolchains/llvm-mingw.zip'
          Invoke-WebRequest -Uri 'https://github.com/mstorsjo/llvm-mingw/releases/download/20261104/llvm-mingw-20261104-ucrt-x86_64.zip' -OutFile $nativeArchive
          if ((Get-FileHash -LiteralPath $nativeArchive -Algorithm SHA256).Hash.ToLowerInvariant() -ne '552191b5754c49a5a20723276a6fc56541ea1922c4c50b7b669022333fc1b40f') { throw 'Pinned LLVM-MinGW archive identity differs' }
          Expand-Archive -LiteralPath $nativeArchive -DestinationPath work/toolchains
          $nativeCompilerBin = Join-Path (Get-Location) 'work/toolchains/llvm-mingw-20261104-ucrt-x86_64/bin'
          $nativeCompiler = Join-Path $nativeCompilerBin 'x86_64-w64-mingw32-clang.exe'
          $env:PATH = "$nativeCompilerBin;$env:PATH"
          foreach ($nativeConfiguration in @('Release', 'Debug')) {
            $nativeBuild = "work/native-scene-matrices/windows-$nativeConfiguration"
            cmake -S ports/native-scene-matrices -B $nativeBuild -G Ninja "-DCMAKE_C_COMPILER=$nativeCompiler" "-DCMAKE_BUILD_TYPE=$nativeConfiguration"
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
            cmake --build $nativeBuild --parallel 2
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
            ctest --test-dir $nativeBuild --output-on-failure
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
          }
      - name: Build Android ARM64
        shell: pwsh
        run: |
          $nativeNdk = Join-Path $env:ANDROID_HOME 'ndk/30.0.16248370'
          $nativeToolchain = Join-Path $nativeNdk 'build/cmake/android.toolchain.cmake'
          if (-not (Test-Path -LiteralPath $nativeToolchain)) { throw 'Pinned Android NDK is unavailable' }
          cmake -S ports/native-scene-matrices -B work/native-scene-matrices/android -G Ninja "-DCMAKE_TOOLCHAIN_FILE=$nativeToolchain" -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-33 -DANDROID_STL=none -DBUILD_TESTING=OFF -DCMAKE_BUILD_TYPE=Release
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cmake --build work/native-scene-matrices/android --parallel 2
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python ports/native-storage/check_android_elf.py work/native-scene-matrices/android/libj2p_native_scene_matrices.so
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python ports/native-storage/check_android_elf.py work/native-scene-matrices/android/j2p_scene_probe --allow-library libj2p_native_scene_matrices.so
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Upload native libraries and runnable probe
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-scene-matrices
          path: |
            work/native-scene-matrices/windows-Release/*.dll
            work/native-scene-matrices/windows-Release/j2p_scene_probe.exe
            work/native-scene-matrices/windows-Debug/*.dll
            work/native-scene-matrices/windows-Debug/j2p_scene_probe.exe
            work/native-scene-matrices/android/libj2p_native_scene_matrices.so
            work/native-scene-matrices/android/j2p_scene_probe
          if-no-files-found: error
